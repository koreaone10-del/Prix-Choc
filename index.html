<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prix Choc - التسوق الذكي</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- قاعدة البيانات -->
    <script src="database.js"></script>

    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            margin: 0; min-height: 100vh;
            background: #0f172a; /* لون ليلي عميق */
            color: #333;
            overflow-x: hidden;
        }

        /* 🌟 الخلفية الخرافية (المنتجات العائمة) 🌟 */
        .floating-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; overflow: hidden; background: linear-gradient(135deg, #0f172a 0%, #064e3b 100%);
        }
        .floating-bg li {
            position: absolute; display: block; list-style: none;
            width: 40px; height: 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(2px); border-radius: 50%;
            animation: floatUp 20s linear infinite;
            bottom: -150px; text-align: center; line-height: 40px; font-size: 20px;
        }
        /* برمجة كل منتج ليطفو بشكل عشوائي */
        .floating-bg li:nth-child(1) { left: 10%; animation-delay: 0s; }
        .floating-bg li:nth-child(2) { left: 20%; width: 60px; height: 60px; animation-delay: 2s; animation-duration: 17s; font-size: 30px; line-height: 60px; }
        .floating-bg li:nth-child(3) { left: 35%; animation-delay: 4s; }
        .floating-bg li:nth-child(4) { left: 50%; width: 80px; height: 80px; animation-delay: 0s; animation-duration: 22s; font-size: 40px; line-height: 80px; }
        .floating-bg li:nth-child(5) { left: 65%; animation-delay: 6s; }
        .floating-bg li:nth-child(6) { left: 75%; width: 50px; height: 50px; animation-delay: 3s; font-size: 25px; line-height: 50px; }
        .floating-bg li:nth-child(7) { left: 85%; animation-delay: 7s; }
        .floating-bg li:nth-child(8) { left: 90%; width: 70px; height: 70px; animation-delay: 1s; font-size: 35px; line-height: 70px; }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
        }

        /* تصميم البطاقة الزجاجي */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="pb-10">

    <!-- الخلفية المتحركة -->
    <ul class="floating-bg">
        <li>🎧</li><li>📱</li><li>🛒</li><li>⌚</li><li>🎁</li><li>👟</li><li>💻</li><li>🎮</li>
    </ul>

    <!-- شريط الثقة -->
    <div class="bg-black/60 text-white text-center py-2 text-sm font-bold flex justify-center items-center gap-2 backdrop-blur-md">
        <span>🚚 الدفع عند الاستلام | توصيل 69 ولاية</span>
    </div>

    <!-- البطاقة الرئيسية -->
    <div class="max-w-md mx-auto p-4 mt-4">
        <div class="glass-card rounded-3xl overflow-hidden shadow-2xl">
            
            <div id="media-container" class="w-full bg-black relative flex justify-center">
                <!-- سيتم حقن الفيديو أو الصورة هنا -->
            </div>

            <div class="p-6">
                <h2 id="product-title" class="text-2xl font-black mb-2 text-gray-800">جاري التحميل...</h2>
                
                <div class="flex justify-between items-center bg-emerald-50 p-4 rounded-xl border border-emerald-100 mb-6">
                    <span class="text-emerald-800 font-bold">سعر المنتج:</span>
                    <span id="base-price-display" class="text-2xl font-black text-emerald-600"></span>
                </div>

                <form id="orderForm" class="space-y-4">
                    <input type="text" id="fullName" required placeholder="الاسم الكامل" class="w-full px-5 py-3 rounded-xl border-2 border-gray-200 focus:border-emerald-500 outline-none font-bold">
                    <input type="tel" id="phone" required pattern="[0-9]{10}" placeholder="رقم الهاتف" class="w-full px-5 py-3 rounded-xl border-2 border-gray-200 focus:border-emerald-500 outline-none font-bold text-left" dir="ltr">

                    <!-- الولاية والبلدية -->
                    <select id="wilaya" required class="w-full px-5 py-3 rounded-xl border-2 border-gray-200 focus:border-emerald-500 outline-none font-bold bg-white">
                        <option value="" disabled selected>-- اختر ولايتك --</option>
                    </select>
                    
                    <select id="commune" required disabled class="w-full px-5 py-3 rounded-xl border-2 border-gray-200 bg-gray-100 opacity-50 font-bold">
                        <option value="" disabled selected>-- اختر البلدية --</option>
                    </select>

                    <input type="text" id="address" required placeholder="العنوان التفصيلي" class="w-full px-5 py-3 rounded-xl border-2 border-gray-200 focus:border-emerald-500 outline-none font-bold">

                    <!-- التوصيل -->
                    <div id="delivery-options" class="bg-gray-50 p-4 rounded-xl border-2 border-gray-200 hidden">
                        <p class="text-sm font-bold text-gray-800 mb-3 border-b pb-2">سعر التوصيل (حسب شركة الشحن):</p>
                        <label class="flex items-center justify-between p-3 border rounded-lg mb-2 bg-white cursor-pointer">
                            <div class="flex items-center gap-2">
                                <input type="radio" name="delivery" value="standard" checked class="w-5 h-5 text-emerald-600">
                                <span class="font-bold text-gray-700">توصيل للمكتب</span>
                            </div>
                            <span id="standard-price" class="font-black text-emerald-600"></span>
                        </label>
                        <label class="flex items-center justify-between p-3 border rounded-lg bg-white cursor-pointer">
                            <div class="flex items-center gap-2">
                                <input type="radio" name="delivery" value="express" class="w-5 h-5 text-emerald-600">
                                <span class="font-bold text-gray-700">توصيل للمنزل</span>
                            </div>
                            <span id="express-price" class="font-black text-rose-500"></span>
                        </label>
                    </div>

                    <div class="bg-gray-900 text-white p-5 rounded-xl text-center shadow-lg mt-4">
                        <p class="text-sm text-gray-400 mb-1">المبلغ الإجمالي (المنتج + التوصيل)</p>
                        <p id="total-price-display" class="text-4xl font-black text-yellow-400">--- د.ج</p>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xl py-4 rounded-xl shadow-lg mt-4">
                        تأكيد الطلب
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('p') || "1"; 
        
        // استخدام setTimeout للتأكد من تحميل ملف database.js
        setTimeout(() => {
            const productData = storeData.products[productId];
            if (!productData) {
                document.body.innerHTML = `<h2 class="text-white text-center mt-20 text-3xl font-bold">المنتج غير متوفر</h2>`;
                return;
            }

            document.getElementById('product-title').innerText = productData.name;
            document.getElementById('base-price-display').innerText = productData.price + ' د.ج';
            
            const mediaContainer = document.getElementById('media-container');
            if (productData.type === 'video') {
                mediaContainer.innerHTML = `<video src="${productData.mediaUrl}" controls autoplay muted loop class="w-full max-h-80 object-cover"></video>`;
            } else {
                mediaContainer.innerHTML = `<img src="${productData.mediaUrl}" class="w-full max-h-80 object-cover">`;
            }

            const wilayaSelect = document.getElementById('wilaya');
            const communeSelect = document.getElementById('commune');
            const deliveryOptionsBox = document.getElementById('delivery-options');
            let currentDeliveryPrice = 0;

            // تعبئة الولايات الـ 69
            for (const [id, wData] of Object.entries(storeData.wilayas)) {
                wilayaSelect.innerHTML += `<option value="${id}">${id} - ${wData.name}</option>`;
            }

            function updateTotalPrice() {
                document.getElementById('total-price-display').innerText = (productData.price + currentDeliveryPrice) + ' د.ج';
            }

            wilayaSelect.addEventListener('change', function() {
                const wData = storeData.wilayas[this.value];
                
                communeSelect.innerHTML = `<option value="" disabled selected>-- اختر البلدية --</option>`;
                wData.communes.forEach(c => { communeSelect.innerHTML += `<option value="${c}">${c}</option>`; });
                communeSelect.disabled = false;
                communeSelect.classList.remove('opacity-50', 'bg-gray-100');
                communeSelect.classList.add('bg-white');

                deliveryOptionsBox.classList.remove('hidden');
                document.getElementById('standard-price').innerText = wData.delivery_fees.standard + ' د.ج';
                document.getElementById('express-price').innerText = wData.delivery_fees.express + ' د.ج';

                currentDeliveryPrice = wData.delivery_fees[document.querySelector('input[name="delivery"]:checked').value];
                updateTotalPrice();
            });

            document.querySelectorAll('input[name="delivery"]').forEach(radio => {
                radio.addEventListener('change', function() {
                    if(wilayaSelect.value) {
                        currentDeliveryPrice = storeData.wilayas[wilayaSelect.value].delivery_fees[this.value];
                        updateTotalPrice();
                    }
                });
            });
        }, 500);
    </script>
</body>
</html>
