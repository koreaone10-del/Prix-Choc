<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر Prix Choc | الدفع عند الاستلام</title>
    
    <!-- ربط قواعد البيانات والمنتجات -->
    <script src="database.js"></script>
    <script src="products.js"></script>

    <style>
        body {
            background-color: #ECE5DD; 
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            margin: 0; padding: 0; display: flex; justify-content: center;
        }
        .chat-app {
            width: 100%; max-width: 500px; min-height: 100vh;
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            display: flex; flex-direction: column; box-shadow: 0 0 15px rgba(0,0,0,0.15);
        }
        .chat-header {
            background-color: #075E54; color: white; padding: 15px; text-align: center;
            position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .chat-header h1 { margin: 0; font-size: 22px; }
        .chat-header .badge { background: #f59e0b; color: #fff; font-size: 12px; padding: 3px 10px; border-radius: 15px; display: inline-block; margin-top: 5px; }
        .chat-container { padding: 20px; flex-grow: 1; }
        .message-bubble {
            background-color: #FFFFFF; padding: 15px; border-radius: 12px; border-top-right-radius: 0;
            margin-bottom: 20px; width: 88%; box-shadow: 0 1px 2px rgba(0,0,0,0.15); position: relative; box-sizing: border-box;
        }
        .message-bubble.bot { background-color: #DCF8C6; border-top-right-radius: 12px; border-top-left-radius: 0; margin-left: auto; margin-right: 0; }
        .product-img { width: 100%; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 10px; }
        .product-title { font-size: 16px; font-weight: bold; color: #1a1a1a; margin-bottom: 10px; line-height: 1.4; }
        .price-box { background: #f8f9fa; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; color: #555; }
        .price-box .total { font-weight: bold; font-size: 18px; color: #075E54; margin-top: 8px; border-top: 1px solid #ddd; padding-top: 8px; }
        .form-input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .btn-order {
            background-color: #25D366; color: white; border: none; padding: 14px; width: 100%;
            border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; display: block; box-sizing: border-box;
        }
        .security-footer { text-align: center; font-size: 12px; color: #666; margin-top: 10px; }
    </style>
</head>
<body>

<div class="chat-app">
    <div class="chat-header">
        <h1>🇩🇿 Prix Choc</h1>
        <div class="badge">🚚 الدفع عند الاستلام متاح</div>
    </div>
    <div class="chat-container" id="chat-content"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        let productId = urlParams.get('p');
        const chatContent = document.getElementById('chat-content');

        if (!productId || !storeData[productId]) {
            let html = `<div class="message-bubble bot">مرحباً بك! 👋<br>اختر المنتج الذي يناسبك:</div>`;
            for (const [id, prod] of Object.entries(storeData)) {
                html += `
                    <div class="message-bubble">
                        <img src="${prod.image}" class="product-img">
                        <div class="product-title">${prod.name}</div>
                        <div class="price-box" style="font-weight:bold; color:#075E54; font-size:18px;">${prod.price} د.ج</div>
                        <a href="?p=${id}" class="btn-order">📝 اطلب الآن</a>
                    </div>`;
            }
            chatContent.innerHTML = html;
            return;
        }

        const product = storeData[productId];
        
        chatContent.innerHTML = `
            <div class="message-bubble">
                <img src="${product.image}" class="product-img">
                <div class="product-title">${product.name}</div>
                <div class="price-box">
                    <div>ثمن المنتج: <b>${product.price} د.ج</b></div>
                    <div id="deliveryCostDisplay">سعر التوصيل: <b>الرجاء اختيار الولاية</b></div>
                    <div class="total" id="finalTotalDisplay">المجموع النهائي: <b>...</b></div>
                </div>
            </div>
            
            <div class="message-bubble bot">ممتاز! يرجى ملء الاستمارة لتأكيد طلبك وتجهيزه للشحن.</div>
            
            <div class="message-bubble" style="width:100%;">
                <form id="orderForm">
                    <input type="text" id="fullName" class="form-input" placeholder="الاسم الكامل" required>
                    <input type="tel" id="phone" class="form-input" placeholder="رقم الهاتف" required>
                    
                    <select id="wilaya" class="form-input" required></select>
                    <input type="text" id="commune" class="form-input" placeholder="البلدية / المدينة (مثال: البوني)" required>
                    <input type="text" id="address" class="form-input" placeholder="العنوان التفصيلي" required>
                    
                    <button type="submit" class="btn-order" id="submitBtn">🚀 تأكيد الطلب</button>
                </form>
                <div class="security-footer">🔒 تسوق آمن 100% | معلوماتك مشفرة ومحمية</div>
            </div>
        `;

        const wilayaSelect = document.getElementById('wilaya');
        initWilayas(wilayaSelect);

        // حساب السعر آلياً عند تغيير الولاية
        wilayaSelect.addEventListener('change', function() {
            const selectedWilaya = this.value;
            const deliveryCost = deliveryPrices[selectedWilaya] || 0;
            const finalTotal = product.price + deliveryCost;
            
            if(selectedWilaya) {
                document.getElementById('deliveryCostDisplay').innerHTML = `سعر التوصيل: <b>${deliveryCost} د.ج</b>`;
                document.getElementById('finalTotalDisplay').innerHTML = `المجموع النهائي: <b>${finalTotal} د.ج</b>`;
            }
        });

        // إرسال الطلبية
        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "⏳ جاري الإرسال...";
            btn.disabled = true;

            const orderData = {
                customerName: document.getElementById('fullName').value,
                phone: document.getElementById('phone').value,
                wilaya: wilayaSelect.value,
                commune: document.getElementById('commune').value,
                address: document.getElementById('address').value,
                sawa9lyLink: product.sawa9lyLink,
                sellingPrice: product.price
            };

            fetch('https://prix-choc-bot.onrender.com/api/order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(orderData)
            })
            .then(res => res.json())
            .then(data => {
                chatContent.innerHTML += `<div class="message-bubble bot" style="width: 100%;">✅ <b>تم استلام طلبك بنجاح!</b><br>سنتصل بك قريباً للتأكيد.</div>`;
                window.scrollTo(0, document.body.scrollHeight);
            })
            .catch(err => {
                alert("حدث خطأ في الاتصال. يرجى المحاولة.");
                btn.innerText = "🚀 تأكيد الطلب";
                btn.disabled = false;
            });
        });
    });
</script>

</body>
</html>
