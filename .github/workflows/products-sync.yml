name: Prix Choc - Product Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

concurrency:
  group: prix-choc-product-sync
  cancel-in-progress: false

jobs:
  sync-products:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify automation files
        working-directory: automation
        run: |
          test -f package.json
          test -f discover.js
          test -f scraper.js
          test -f sync.js
          test -f generator.js
          test -f config.js
          test -f pricing.js
          echo "Automation files: OK"

      - name: Install dependencies
        working-directory: automation
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Chromium
        working-directory: automation
        run: npx playwright install --with-deps chromium

      - name: Create environment
        working-directory: automation
        run: |
          cat > .env <<'EOF'
          SAWA9LY_LOGIN_URL=https://sawa9ly.app/login
          SAWA9LY_DASHBOARD_URL=https://sawa9ly.app/dashboard
          SAWA9LY_EMAIL=${{ secrets.SAWA9LY_EMAIL }}
          SAWA9LY_PASSWORD=${{ secrets.SAWA9LY_PASSWORD }}
          SCRAPE_LIMIT=2094
          SCRAPE_CONCURRENCY=10
          HEADLESS=true
          DRY_RUN=false
          DEFAULT_MARGIN=1000
          MIN_MARGIN=300
          MAX_MARGIN=5000
          PRODUCTS_FILE=../products.js
          OUTPUT_DIR=./output
          EOF

      - name: Run product discovery
        working-directory: automation
        run: npm run discover

      - name: Verify discovery
        working-directory: automation
        run: |
          test -f debug/product-links.json
          test -f debug/discovery-report.json
          test -f state/discovery-history.json
          node -e "const r=require('./debug/discovery-report.json'); if(r.complete!==true) process.exit(1); if(!r.availabilitySafe) process.exit(1); console.log('Discovery complete:',r.productsFound); console.log('Availability safe:',r.availabilitySafe); console.log('Confirmed missing:',(r.confirmedMissingIds||[]).length);"

      - name: Run product sync
        working-directory: automation
        run: npm run sync

      - name: Verify generated output
        working-directory: automation
        run: |
          test -f output/products.raw.json
          node -e "const d=require('./output/products.raw.json'); if(!Array.isArray(d)) process.exit(1); console.log('Products extracted:',d.length);"

      - name: Verify products.js
        run: |
          test -f products.js
          node --check products.js
          echo "products.js syntax: OK"

      - name: Show changes
        run: |
          git status --short
          git diff --name-only

      - name: Commit and push safely
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Prix Choc Bot"
          git config user.email "prix-choc-bot@users.noreply.github.com"

          # CRITICAL:
          # automation/.env is created for the scraper. If .env is tracked in
          # this old repository, deleting it creates an unstaged deletion.
          # That is exactly what makes git rebase fail with:
          # "You have unstaged changes."
          #
          # Restore the repository version instead of deleting a tracked file.
          if git ls-files --error-unmatch automation/.env >/dev/null 2>&1; then
            git restore -- automation/.env
          else
            rm -f automation/.env
          fi

          # Only commit the two intentional generated files.
          git add products.js
          git add -f automation/state/discovery-history.json

          echo "Working tree after cleanup:"
          git status --short

          echo "Staged files:"
          git diff --cached --name-only

          if git diff --cached --quiet; then
            echo "No product/state changes to commit."
            exit 0
          fi

          git commit -m "🤖 Auto update Sawa9ly products"

          # FIRST METHOD:
          # Try a normal fast-forward push. This is safest when main did not
          # move while the workflow was running.
          if git push origin HEAD:main; then
            echo "SAFE PUSH SUCCESSFUL (method 1)"
            exit 0
          fi

          echo "Method 1 failed. Starting fallback method 2..."

          # FALLBACK METHOD:
          # The remote main moved while the job was running. Rebase the local
          # automation commit on the new remote main, then push.
          git fetch origin main

          if git rebase origin/main; then
            if git push origin HEAD:main; then
              echo "SAFE PUSH SUCCESSFUL (method 2 - rebase)"
              exit 0
            fi
          else
            echo "Rebase fallback failed; aborting rebase."
            git rebase --abort || true
          fi

          echo "Rebase fallback did not succeed. Trying final non-destructive merge fallback..."

          # FINAL FALLBACK:
          # Merge remote main without rewriting existing history.
          if git merge --no-edit origin/main; then
            if git push origin HEAD:main; then
              echo "SAFE PUSH SUCCESSFUL (method 3 - merge)"
              exit 0
            fi
          else
            echo "Merge fallback failed; aborting merge."
            git merge --abort || true
          fi

          echo "ERROR: All push methods failed. No force-push is performed."
          exit 1
