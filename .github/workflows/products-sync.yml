name: Prix-Choc - Sawa9ly Product Sync

on:
  workflow_dispatch:

  schedule:
    # Every day at 02:00 UTC ≈ 03:00 Algeria time
    - cron: "0 2 * * *"

permissions:
  contents: write

concurrency:
  group: prix-choc-product-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Discover → Scrape → Generate → Verify → Commit
    runs-on: ubuntu-latest
    timeout-minutes: 120

    defaults:
      run:
        working-directory: automation

    env:
      NODE_VERSION: "20"

      SAWA9LY_BASE_URL: "https://affiliate.sawa9ly.pro"
      SAWA9LY_LOGIN_URL: "https://affiliate.sawa9ly.pro/login"
      SAWA9LY_DASHBOARD_URL: "https://affiliate.sawa9ly.pro/store"

      SCRAPE_LIMIT: "2094"
      SCRAPE_CONCURRENCY: "8"

      HEADLESS: "true"
      DRY_RUN: "false"

      MISSING_CONFIRMATION_RUNS: "2"
      MINIMUM_COVERAGE_PERCENT: "70"
      MAX_DISCOVERY_PAGES: "250"

      PAGE_TIMEOUT_MS: "30000"
      NAVIGATION_TIMEOUT_MS: "30000"
      RENDER_WAIT_MS: "1200"

      DEFAULT_MARGIN: "1000"
      MIN_MARGIN: "300"
      MAX_MARGIN: "5000"

      PRODUCTS_FILE: "../products.js"
      OUTPUT_DIR: "./output"
      DEBUG_DIR: "./debug"
      STATE_DIR: "./state"
      HISTORY_DIR: "./state/history"
      BACKUP_DIR: "./backups"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: automation/package-lock.json

      - name: Install automation dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare automation directories
        run: |
          rm -rf output
          mkdir -p output debug state state/history backups
          rm -f .env

      - name: Create runtime environment
        env:
          SAWA9LY_EMAIL_SECRET: ${{ secrets.SAWA9LY_EMAIL }}
          SAWA9LY_PASSWORD_SECRET: ${{ secrets.SAWA9LY_PASSWORD }}
        run: |
          cat > .env <<EOF
          SAWA9LY_BASE_URL=${SAWA9LY_BASE_URL}
          SAWA9LY_LOGIN_URL=${SAWA9LY_LOGIN_URL}
          SAWA9LY_DASHBOARD_URL=${SAWA9LY_DASHBOARD_URL}
          SAWA9LY_EMAIL=${SAWA9LY_EMAIL_SECRET}
          SAWA9LY_PASSWORD=${SAWA9LY_PASSWORD_SECRET}

          SCRAPE_LIMIT=${SCRAPE_LIMIT}
          SCRAPE_CONCURRENCY=${SCRAPE_CONCURRENCY}
          HEADLESS=${HEADLESS}
          DRY_RUN=${DRY_RUN}

          MISSING_CONFIRMATION_RUNS=${MISSING_CONFIRMATION_RUNS}
          MINIMUM_COVERAGE_PERCENT=${MINIMUM_COVERAGE_PERCENT}
          MAX_DISCOVERY_PAGES=${MAX_DISCOVERY_PAGES}

          PAGE_TIMEOUT_MS=${PAGE_TIMEOUT_MS}
          NAVIGATION_TIMEOUT_MS=${NAVIGATION_TIMEOUT_MS}
          RENDER_WAIT_MS=${RENDER_WAIT_MS}

          DEFAULT_MARGIN=${DEFAULT_MARGIN}
          MIN_MARGIN=${MIN_MARGIN}
          MAX_MARGIN=${MAX_MARGIN}

          PRODUCTS_FILE=${PRODUCTS_FILE}
          OUTPUT_DIR=${OUTPUT_DIR}
          DEBUG_DIR=${DEBUG_DIR}
          STATE_DIR=${STATE_DIR}
          HISTORY_DIR=${HISTORY_DIR}
          BACKUP_DIR=${BACKUP_DIR}
          EOF
          chmod 600 .env

      - name: Validate automation syntax
        run: |
          node --check config.js
          node --check discover.js
          node --check scraper.js
          node --check generator.js

      - name: Validate existing products.js
        run: |
          test -f ../products.js
          node --check ../products.js

      - name: Print safe configuration summary
        run: node -e "import('./config.js').then(({printConfigSummary}) => printConfigSummary())"

      - name: Discover Sawa9ly catalogue
        run: npm run discover

      - name: Verify discovery results
        run: |
          test -f debug/product-links.json
          test -f debug/discovery-report.json

          node <<'NODE'
          const fs = require("fs");

          const links = JSON.parse(
            fs.readFileSync("debug/product-links.json", "utf8")
          );
          const report = JSON.parse(
            fs.readFileSync("debug/discovery-report.json", "utf8")
          );

          if (!Array.isArray(links) || links.length === 0) {
            throw new Error(
              "Discovery returned zero product links. Aborting safely."
            );
          }

          if (!report || report.complete !== true) {
            throw new Error(
              "Discovery report is not complete. Aborting safely."
            );
          }

          if (report.availabilitySafe !== true) {
            throw new Error(
              "Discovery is not availability-safe. Aborting safely."
            );
          }

          const uniqueIds = new Set();
          for (const item of links) {
            const value =
              typeof item === "string"
                ? item
                : item?.sawa9lyId || item?.href || item?.url || "";

            const match = String(value).match(/\/(?:store|product)\/(\d+)/i);
            const id = item?.sawa9lyId || (match ? match[1] : "");

            if (id) uniqueIds.add(String(id));
          }

          if (uniqueIds.size === 0) {
            throw new Error(
              "Discovery produced links but no valid Sawa9ly IDs."
            );
          }

          console.log(`Discovered links: ${links.length}`);
          console.log(`Unique Sawa9ly IDs: ${uniqueIds.size}`);
          console.log(`Availability safe: ${report.availabilitySafe}`);
          console.log(`Discovery complete: ${report.complete}`);
          NODE

      - name: Scrape product catalogue
        run: npm run scrape

      - name: Verify scraper results
        run: |
          test -f output/products.raw.json
          test -f debug/scraper-report.json

          node <<'NODE'
          const fs = require("fs");

          const raw = JSON.parse(
            fs.readFileSync("output/products.raw.json", "utf8")
          );
          const report = JSON.parse(
            fs.readFileSync("debug/scraper-report.json", "utf8")
          );

          if (!Array.isArray(raw) || raw.length === 0) {
            throw new Error(
              "Scraper returned zero products. Existing catalogue will not be replaced."
            );
          }

          if (report.safeToPublish !== true) {
            throw new Error(
              "Scraper marked this run unsafe to publish."
            );
          }

          if (report.fullCatalogSelected !== true) {
            throw new Error(
              "Scraper did not process the full discovered catalogue."
            );
          }

          if (report.coverageSafe !== true) {
            throw new Error(
              `Scraper coverage is unsafe: ${report.coveragePercent ?? "unknown"}%`
            );
          }

          if (Number(report.scraped || 0) !== raw.length) {
            throw new Error(
              `Scraper report mismatch: report=${report.scraped}, raw=${raw.length}`
            );
          }

          console.log(`Raw products scraped: ${raw.length}`);
          console.log(`Coverage: ${report.coveragePercent}%`);
          console.log(`Full catalogue: ${report.fullCatalogSelected}`);
          console.log(`Safe to publish: ${report.safeToPublish}`);
          NODE

      - name: Generate products.js safely
        run: npm run generate

      - name: Validate generated products.js
        run: |
          test -f ../products.js
          node --check ../products.js

      - name: Verify catalogue integrity
        run: |
          node <<'NODE'
          const fs = require("fs");
          const vm = require("vm");

          const source = fs.readFileSync("../products.js", "utf8");

          if (!source.trim()) {
            throw new Error("products.js is EMPTY.");
          }

          let storeData = null;

          const match = source.match(
            /(?:const|let|var)\s+storeData\s*=\s*([\s\S]*?);\s*$/
          );

          if (match) {
            const sandbox = {};
            vm.runInNewContext(
              `globalThis.__value = ${match[1]};`,
              sandbox,
              { timeout: 5000 }
            );
            storeData = sandbox.__value;
          } else {
            const arrayMatch = source.match(
              /(?:const|let|var)\s+products\s*=\s*(\[[\s\S]*\])\s*;\s*(?:export\s+default\s+products\s*;?)?$/
            );

            if (arrayMatch) {
              const sandbox = {};
              vm.runInNewContext(
                `globalThis.__value = ${arrayMatch[1]};`,
                sandbox,
                { timeout: 5000 }
              );
              storeData = sandbox.__value;
            }
          }

          if (!storeData || typeof storeData !== "object") {
            throw new Error(
              "products.js could not be parsed as storeData or compatible products array."
            );
          }

          const products = Array.isArray(storeData)
            ? storeData
            : Object.values(storeData);

          if (products.length === 0) {
            throw new Error(
              "Generated products.js contains zero products."
            );
          }

          const ids = new Set();

          for (const product of products) {
            if (!product || typeof product !== "object") {
              throw new Error("Invalid product object detected.");
            }

            if (product.sawa9lyId) {
              const id = String(product.sawa9lyId);

              if (ids.has(id)) {
                throw new Error(
                  `Duplicate sawa9lyId detected: ${id}`
                );
              }

              ids.add(id);

              if (!Array.isArray(product.images) || product.images.length === 0) {
                throw new Error(
                  `Product ${id} has no images[].`
                );
              }

              if (typeof product.available !== "boolean") {
                throw new Error(
                  `Product ${id} has invalid available field.`
                );
              }
            }
          }

          console.log(`Final products: ${products.length}`);
          console.log(`Sawa9ly products: ${ids.size}`);
          console.log("Catalogue integrity: PASS");
          NODE

      - name: Verify protected frontend files
        run: |
          cd ..
          if git diff --quiet -- index.html database.js locations.js; then
            echo "Protected files: unchanged"
          else
            echo "ERROR: Protected project files were modified."
            git diff -- index.html database.js locations.js
            exit 1
          fi

      - name: Remove runtime secrets
        if: always()
        run: |
          # .env is historically tracked in this repository. Never leave its
          # deletion as an unstaged change because it blocks rebase/push.
          if git -C .. ls-files --error-unmatch automation/.env >/dev/null 2>&1; then
            git -C .. restore -- automation/.env
          else
            rm -f .env
          fi

      - name: Inspect Git changes
        run: |
          cd ..
          echo "=============================="
          echo "GIT STATUS"
          echo "=============================="
          git status --short

          echo ""
          echo "=============================="
          echo "PRODUCTS.JS DIFF STAT"
          echo "=============================="
          git diff --stat -- products.js

      - name: Stage generated catalogue
        run: |
          cd ..
          git add products.js

          # Discovery history is the state used to confirm missing products.
          # It must be committed together with products.js.
          if [ -f automation/state/discovery-history.json ]; then
            git add automation/state/discovery-history.json
          fi

          if [ -d automation/state/history ]; then
            git add automation/state/history
          fi

      - name: Commit catalogue changes
        run: |
          cd ..

          if git diff --cached --quiet; then
            echo "No catalogue changes detected."
            exit 0
          fi

          git config user.name "Prix-Choc Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: sync Sawa9ly products"

      - name: Synchronize and push catalogue update
        run: |
          cd ..
          set -euo pipefail

          # The working tree MUST be clean before rebase. This catches
          # accidental tracked runtime files before Git can abort the job.
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: Working tree is not clean before synchronization."
            git status --short
            exit 1
          fi

          # Nothing to push is a successful no-op.
          if [ -z "$(git log -1 --format=%H)" ]; then
            echo "No commit available."
            exit 0
          fi

          git fetch origin main

          # If the remote moved after checkout, rebase the automation commit
          # onto the latest main. Because the tree is clean, rebase is safe.
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "Remote main advanced; rebasing cleanly..."
            git rebase origin/main
          fi

          git push origin HEAD:main

      - name: Final verification
        if: always()
        run: |
          cd ..

          echo ""
          echo "======================================"
          echo "Prix-Choc Product Sync finished"
          echo "======================================"

          git status --short

          echo ""
          echo "Latest commit:"
          git log -1 --oneline
