name: Prix Choc - Daily Sawa9ly Product Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

concurrency:
  group: prix-choc-product-sync
  cancel-in-progress: false

jobs:
  sync-products:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify automation files
        working-directory: automation
        run: |
          test -f package.json
          test -f discover.js
          test -f scraper.js
          test -f sync.js
          test -f generator.js
          test -f config.js
          test -f pricing.js
          node --check discover.js
          node --check scraper.js
          node --check sync.js
          node --check generator.js
          node --check config.js
          echo "Automation syntax: OK"

      - name: Install dependencies
        working-directory: automation
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Chromium
        working-directory: automation
        run: npx playwright install --with-deps chromium

      - name: Create environment
        working-directory: automation
        run: |
          cat > .env <<'EOF'
          SAWA9LY_LOGIN_URL=https://affiliate.sawa9ly.pro/
          SAWA9LY_DASHBOARD_URL=https://affiliate.sawa9ly.pro/store
          SAWA9LY_EMAIL=${{ secrets.SAWA9LY_EMAIL }}
          SAWA9LY_PASSWORD=${{ secrets.SAWA9LY_PASSWORD }}
          SCRAPE_LIMIT=2094
          SCRAPE_CONCURRENCY=8
          MISSING_CONFIRMATION_RUNS=2
          HEADLESS=true
          DRY_RUN=false
          DEFAULT_MARGIN=1000
          MIN_MARGIN=300
          MAX_MARGIN=5000
          PRODUCTS_FILE=../products.js
          OUTPUT_DIR=./output
          EOF

      - name: Run full product discovery
        working-directory: automation
        run: npm run discover

      - name: Verify discovery integrity
        working-directory: automation
        run: |
          test -s debug/product-links.json
          test -s debug/discovery-report.json
          test -s state/discovery-history.json

          node - <<'NODE'
          const fs = require("fs");
          const r = JSON.parse(
            fs.readFileSync("debug/discovery-report.json", "utf8")
          );

          if (r.complete !== true) {
            throw new Error("Discovery is not complete.");
          }

          if (r.availabilitySafe !== true) {
            throw new Error("Discovery is not availability-safe.");
          }

          if (!Number(r.productsFound)) {
            throw new Error("Discovery returned zero products.");
          }

          console.log("Discovery:", r.productsFound);
          console.log("Availability safe:", r.availabilitySafe);
          console.log(
            "Confirmed missing:",
            (r.confirmedMissingIds || []).length
          );
          NODE

      - name: Run full scrape and sync
        working-directory: automation
        run: npm run sync

      - name: Verify generated data
        working-directory: automation
        run: |
          test -f output/products.raw.json
          test -f debug/scraper-debug.json

          node - <<'NODE'
          const fs = require("fs");

          const products = JSON.parse(
            fs.readFileSync("output/products.raw.json", "utf8")
          );

          const report = JSON.parse(
            fs.readFileSync("debug/scraper-debug.json", "utf8")
          );

          if (!Array.isArray(products) || products.length === 0) {
            throw new Error("Scraper returned zero products.");
          }

          console.log("Scraped:", products.length);
          console.log("Failed:", report.failed);
          console.log("Coverage:", report.coverage);
          console.log("Images:", report.totalImages);
          NODE

      - name: Verify products.js
        run: |
          test -f products.js
          node --check products.js
          echo "products.js syntax: OK"

      - name: Show changes
        run: |
          git status --short
          git diff --stat

      - name: Commit and push safely
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Prix Choc Bot"
          git config user.email "prix-choc-bot@users.noreply.github.com"

          if git ls-files --error-unmatch automation/.env >/dev/null 2>&1; then
            git restore -- automation/.env
          else
            rm -f automation/.env
          fi

          git add products.js
          git add -f automation/state/discovery-history.json

          if git diff --cached --quiet; then
            echo "No product/state changes to commit."
            exit 0
          fi

          git commit -m "🤖 Daily Sawa9ly catalog sync"

          if git push origin HEAD:main; then
            echo "SAFE PUSH SUCCESSFUL"
            exit 0
          fi

          git fetch origin main

          if git rebase origin/main; then
            git push origin HEAD:main
            exit 0
          fi

          git rebase --abort || true

          if git merge --no-edit origin/main; then
            git push origin HEAD:main
            exit 0
          fi

          git merge --abort || true
          echo "ERROR: Push failed. No force push was used."
          exit 1
